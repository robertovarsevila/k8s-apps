apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics-api
  namespace: metrics-api
spec:
  ingressClassName: traefik
  rules:
    # Enrutado por Host, igual que podinfo: hay que pedir "metrics-api.local"
    # explicitamente o Traefik devuelve 404. Se entra por el NodePort 32602.
    - host: metrics-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metrics-api
                port:
                  number: 80
