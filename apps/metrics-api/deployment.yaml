apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-api
  namespace: metrics-api
  labels:
    app: metrics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-api
  template:
    metadata:
      labels:
        app: metrics-api
    spec:
      containers:
        - name: metrics-api
          # Imagen construida e importada a mano en esta Pi (docker build +
          # k3s ctr images import), no hay registry todavia.
          image: docker.io/library/metrics-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: metrics-api-config
          env:
            # El token SI es sensible: nunca en el repo (es publico). El
            # Secret se crea a mano una vez, ver README.md de esta app.
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metrics-api-influx
                  key: INFLUX_TOKEN
          # Una JVM necesita bastante mas que el binario Go de podinfo.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
