apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: regatas
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # GHCR es privado: el kubelet necesita el imagePullSecret 'ghcr-pull'
      # (creado a mano en el namespace 'regatas', ver deploy/GITOPS.md en
      # regata-platform). El CI reescribe la imagen a ghcr.io/... en cada push.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api-gateway
          # Imagen en GHCR. El tag lo reescribe el CI de regata-platform
          # (workflow api-gateway.yml) en cada push a main. Contexto de
          # build = esta misma carpeta del servicio (Maven autocontenido,
          # ADR 0007 no aplica; ver Dockerfile).
          image: ghcr.io/robertovarsevila/api-gateway:sha-cdb645f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8094
              protocol: TCP
          envFrom:
            - configMapRef:
                name: api-gateway-config
          env:
            # El token SI es sensible: nunca en el repo (es publico). Secret
            # propio de este servicio (mismo token que ingest/analysis-service,
            # ver README.md de este repo).
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: regata-api-gateway-influx
                  key: INFLUXDB_TOKEN
          # JVM, igual que session-service: mismos requests/limits.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
