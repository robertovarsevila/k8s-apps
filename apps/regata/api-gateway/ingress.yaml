apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: regatas
spec:
  ingressClassName: traefik
  rules:
    # Enrutado por Host, igual que el resto de regata-platform: hay que pedir
    # "gateway.regata.local" explicitamente o Traefik devuelve 404. Se entra
    # por el NodePort 32602.
    - host: gateway.regata.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
