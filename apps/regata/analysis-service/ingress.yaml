apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analysis-service
  namespace: regatas
spec:
  ingressClassName: traefik
  rules:
    # Enrutado por Host, igual que ingest-service/session-service: hay que
    # pedir "analysis.regata.local" explicitamente o Traefik devuelve 404. Se
    # entra por el NodePort 32602.
    - host: analysis.regata.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analysis-service
                port:
                  number: 80
