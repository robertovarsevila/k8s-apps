apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: regatas
  labels:
    app: ingest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-service
  template:
    metadata:
      labels:
        app: ingest-service
    spec:
      # GHCR es privado: el kubelet necesita el imagePullSecret 'ghcr-pull'
      # (creado a mano en el namespace 'regatas', ver deploy/GITOPS.md en
      # regata-platform). El CI reescribe la imagen a ghcr.io/... en cada push.
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ingest-service
          # Imagen construida e importada a mano en esta Pi (docker build +
          # k3s ctr images import), no hay registry todavia. Contexto de build
          # = raiz del monorepo regata-platform (ver ADR 0007 de ese repo).
          image: ghcr.io/robertovarsevila/ingest-service:sha-cdb645f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ingest-service-config
          env:
            # El token SI es sensible: nunca en el repo (es publico). El
            # Secret se crea a mano una vez, ver README.md de este repo.
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: regata-ingest-service-influx
                  key: INFLUXDB_TOKEN
          # Python/FastAPI: bastante mas ligero que la JVM de metrics-api.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
