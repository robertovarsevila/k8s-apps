apiVersion: v1
kind: ConfigMap
metadata:
  name: session-service-config
  namespace: regatas
data:
  # No sensible: nombre de la base, no las credenciales.
  POSTGRES_DB: "regata"
  # DNS interno del cluster: <servicio>.<namespace>.svc.cluster.local se
  # resuelve como "session-service-postgres" a secas dentro del mismo
  # namespace (regatas). Nada que ver con la Postgres de docker-compose del
  # host, que es solo para dev local (ADR 0004 de regata-platform).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://session-service-postgres:5432/regata"
