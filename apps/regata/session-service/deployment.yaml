apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-service
  namespace: regatas
  labels:
    app: session-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: session-service
  template:
    metadata:
      labels:
        app: session-service
    spec:
      # GHCR es privado: el kubelet necesita credenciales para el pull.
      # Secret docker-registry 'ghcr-pull' creado a mano una vez en el
      # namespace 'regatas' (ver deploy/GITOPS.md en regata-platform).
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: session-service
          # Imagen en GHCR. El tag lo reescribe el CI (workflow
          # session-service.yml de regata-platform) en cada push a main
          # (writeback), con el sha corto del commit. Contexto de build =
          # esta carpeta del servicio (Maven autocontenido).
          image: ghcr.io/robertovarsevila/session-service:sha-cdb645f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: session-service-config
          env:
            # Mismo Secret que usa la propia Postgres (postgres.yaml) para
            # POSTGRES_USER/POSTGRES_PASSWORD -- una sola fuente de verdad
            # para las credenciales, se crea a mano una vez (ADR 0005).
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: session-service-postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: session-service-postgres
                  key: POSTGRES_PASSWORD
            # Secreto compartido para VERIFICAR los JWT (ADR 0013, Fase B): el
            # MISMO Secret 'auth-jwt' que usa auth-service para firmarlos. De
            # momento en modo permisivo (session-service no exige token todavía).
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-jwt
                  key: AUTH_JWT_SECRET
          # Una JVM necesita bastante más que el binario Go de podinfo (igual
          # que metrics-api).
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # initialDelaySeconds más alto que en ingest-service (Python): la
          # JVM + Flyway + Hibernate tardan más en arrancar en frío en la Pi.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
