apiVersion: v1
kind: ConfigMap
metadata:
  name: crew-service-config
  namespace: regatas
data:
  # No sensible: nombre de la base, no las credenciales.
  POSTGRES_DB: "crew"
  # DNS interno del cluster: <servicio>.<namespace>.svc.cluster.local se
  # resuelve como "crew-service-postgres" a secas dentro del mismo namespace
  # (regatas). Nada que ver con la Postgres de docker-compose del host, que es
  # solo para dev local (variables CREW_ prefijadas, ver ADR 0009).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://crew-service-postgres:5432/crew"
  # session-service SÍ está en el cluster (mismo namespace regatas): se llega
  # por el Service interno, no por la IP de la Pi (ADR 0003/0009).
  SESSION_SERVICE_URL: "http://session-service.regatas.svc.cluster.local"
