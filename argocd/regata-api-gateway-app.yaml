apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regata-api-gateway
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/robertovarsevila/k8s-apps.git
    targetRevision: main
    path: apps/regata/api-gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: regatas

  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
